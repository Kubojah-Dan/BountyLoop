[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bountyloop-api"
version = "0.1.0"
description = "BountyLoop — FastAPI backend for AI-powered food rescue"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "python-multipart>=0.0.12",

    # Config / settings
    "pydantic-settings>=2.5.0",
    "pydantic[email]>=2.9.0",
    "email-validator>=2.2.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.29.0",

    # HTTP client
    "httpx>=0.27.0",

    # Firebase Auth
    "firebase-admin>=6.5.0",

    # Serialization
    "orjson>=3.10.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Utilities
    "pillow>=10.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.9.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff configuration ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N805"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "alembic/versions/"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["alembic/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
