name: CI

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff (linter)
        run: python -m ruff check app/ tests/

      - name: Run black (format check)
        run: python -m black --check app/ tests/

      - name: Run mypy (type check)
        run: python -m mypy app/ --ignore-missing-imports
        continue-on-error: true  # relaxed until Phase 2 stubs are filled

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bountyloop
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: bountyloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bountyloop -d bountyloop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://bountyloop:changeme@localhost:5432/bountyloop_test
      DATABASE_URL_SYNC: postgresql+psycopg://bountyloop:changeme@localhost:5432/bountyloop_test
      APP_ENV: testing
      APP_VERSION: "0.1.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  test-cv:
    name: CV service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CV dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx anyio

      - name: Run CV tests
        run: python -m pytest tests/ -v --tb=short
        # Note: Phase 0 has no CV tests yet; this gate is green-by-default
        continue-on-error: true
