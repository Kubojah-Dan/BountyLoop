name: CI — BountyLoop Test & Quality Pipeline

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Backend Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black mypy -e ".[dev]"

      - name: Ruff Lint Check
        run: ruff check app/ tests/

      - name: Black Format Check
        run: black --check app/ tests/

  test-backend:
    name: Backend Test Suite (PostGIS 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bountyloop
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: bountyloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bountyloop -d bountyloop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://bountyloop:changeme@localhost:5432/bountyloop_test
      DATABASE_URL_SYNC: postgresql+psycopg://bountyloop:changeme@localhost:5432/bountyloop_test
      APP_ENV: testing
      APP_VERSION: "0.1.0"
      INTERNAL_SERVICE_TOKEN: ci-test-token-32chars-strictly-for-testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic Migrations
        run: alembic upgrade head

      - name: Run Pytest Suite
        run: pytest tests/ -v --tb=short

  test-cv:
    name: CV Microservice Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv_service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CV dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx anyio

      - name: Run CV tests
        run: pytest tests/ -v --tb=short

  test-ml:
    name: ML Model Validation & Forecasting Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install ML dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements-ml.txt

      - name: Run Forecaster and Cascade Tests
        run: pytest ml/tests/ -v --tb=short

  test-dashboard:
    name: Web Dashboard Build & TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci

      - name: Build Dashboard (Vite + TypeScript)
        run: npm run build

  test-mobile:
    name: Flutter Mobile Tests & Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test
